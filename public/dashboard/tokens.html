<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title data-i18n="dashboard_tokens.meta_title">Agent Tokens · three.ws</title>
		<link rel="stylesheet" href="/dashboard/_dash-shell.css" />
	</head>
	<body>
		<div class="dash-shell">
			<a class="dash-back" href="/dashboard/agents" data-i18n="dashboard_tokens.back_to_dashboard">← Back to dashboard</a>
			<h1 class="dash-title" data-i18n="dashboard_tokens.agent_tokens">Agent Tokens</h1>
			<p class="dash-sub" data-i18n-html="dashboard_tokens.if_your_agent_has_launched_a_pump">
				If your agent has launched a Pump.fun token, the live state lives here. Launch a new one via
				<a href="/dashboard/agent-pumpfun">Agent · Pump.fun</a> or from the agent's home page.
			</p>

			<div id="picker"></div>
			<div id="status"></div>
			<div id="content"></div>
		</div>

		<script type="module">
			import { mountAgentPicker } from '/src/dashboard/_agent-picker.js';

			const statusEl = document.getElementById('status');
			const contentEl = document.getElementById('content');

			function showStatus(msg, kind = '') {
				statusEl.innerHTML = msg
					? `<div class="${kind === 'err' ? 'dash-err' : 'dash-ok'}">${escapeHtml(msg)}</div>`
					: '';
			}
			function escapeHtml(s) {
				return String(s == null ? '' : s).replace(
					/[&<>"']/g,
					(c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[c],
				);
			}

			async function getAgent(agentId) {
				const r = await fetch(`/api/agents/${encodeURIComponent(agentId)}`, {
					credentials: 'include',
				});
				if (!r.ok) throw new Error(`HTTP ${r.status}`);
				return (await r.json()).agent;
			}

			// Live state from three.ws's own reads: the coin record (/api/pump/coin,
			// pump.fun's search route server-side) and the bonding curve read on-chain
			// (/api/pump/curve). The page used to call pump.fun's /coins/<mint> from the
			// browser; pump.fun retired that route on 2026-11-25.
			async function getJson(url) {
				try {
					const r = await fetch(url);
					return r.ok ? await r.json() : null;
				} catch {
					return null;
				}
			}
			async function fetchPumpData(mint) {
				const q = encodeURIComponent(mint);
				const [coin, view] = await Promise.all([getJson(`/api/pump/coin?mint=${q}`), getJson(`/api/pump/curve?mint=${q}`)]);
				if (!coin && !view) return null;
				const curve = view?.curve || null;
				const usd = coin?.usd_market_cap ?? view?.graduatedPrice?.marketCapUsd ?? view?.price?.marketCapUsd ?? null;
				return {
					usd_market_cap: Number.isFinite(Number(usd)) && usd != null ? Number(usd) : null,
					sol_in_curve: curve && !curve.complete ? Number(curve.realSolReserves) / 1e9 : null,
					tokens_left: curve && !curve.complete ? Number(curve.realTokenReserves) / 1e6 : null,
					complete: Boolean(coin?.complete || view?.graduated || curve?.complete),
				};
			}

			async function render(agentId) {
				contentEl.innerHTML = '<div class="dash-empty">Loading token data…</div>';
				let agent;
				try {
					agent = await getAgent(agentId);
				} catch (e) {
					showStatus(e.message || 'Failed to load agent', 'err');
					return;
				}

				const token = agent?.token || agent?.meta?.token || null;
				if (!token?.mint) {
					contentEl.innerHTML = `
						<div class="dash-card">
							<h2>No token launched</h2>
							<p class="dash-muted" style="margin-bottom:14px">
								This agent has no Pump.fun token yet. Launch one from the agent's home page or via the
								Pump.fun studio.
							</p>
							<div class="dash-row">
								<a class="dash-btn primary" href="/agents/${encodeURIComponent(agentId)}">Open agent</a>
								<a class="dash-btn" href="/dashboard/agent-pumpfun">Pump.fun studio</a>
							</div>
						</div>`;
					return;
				}

				const live = token.cluster === 'mainnet' ? await fetchPumpData(token.mint) : null;
				const usdMc = live?.usd_market_cap;
				const solBalance = live?.sol_in_curve;
				const tokensLeft = live?.tokens_left;
				const complete = live?.complete;

				contentEl.innerHTML = `
					<div class="dash-card">
						<h2>${escapeHtml(token.name || 'Token')} · ${escapeHtml(token.symbol || '')}</h2>
						<div class="dash-row" style="gap:18px;flex-wrap:wrap;margin-bottom:14px">
							${token.image ? `<img src="${escapeHtml(token.image)}" alt="" width="64" height="64" style="border-radius:10px;background:#1b1b1b" />` : ''}
							<div style="flex:1;min-width:240px">
								<div class="dash-mono">${escapeHtml(token.mint)}</div>
								<div class="dash-muted" style="margin-top:4px">
									Launched ${token.launched_at ? new Date(token.launched_at).toLocaleString() : '—'}
									${token.cluster ? ' · ' + escapeHtml(token.cluster) : ''}
								</div>
								${token.description ? `<p style="margin:8px 0 0;color:#ccc">${escapeHtml(token.description)}</p>` : ''}
							</div>
						</div>
						<div class="dash-row">
							${token.pumpfun_url ? `<a class="dash-btn primary" href="${escapeHtml(token.pumpfun_url)}" target="_blank" rel="noopener">Pump.fun ↗</a>` : ''}
							${token.explorer_url ? `<a class="dash-btn" href="${escapeHtml(token.explorer_url)}" target="_blank" rel="noopener">Explorer ↗</a>` : ''}
							<a class="dash-btn" href="https://three.ws/api/coin/dextools?address=${encodeURIComponent(token.mint)}&network=solana&from=dashboard-tokens" target="_blank" rel="noopener">DEXTools ↗</a>
							<a class="dash-btn" href="https://dexscreener.com/solana/${encodeURIComponent(token.mint)}" target="_blank" rel="noopener">DEX Screener ↗</a>
							<a class="dash-btn" href="https://birdeye.so/token/${encodeURIComponent(token.mint)}?chain=solana" target="_blank" rel="noopener">Birdeye ↗</a>
						</div>
					</div>

					${
						live
							? `<div class="dash-card">
									<h2>Live state</h2>
									<div class="dash-row" style="gap:24px">
										<div>
											<div class="dash-muted" style="font-size:11px;text-transform:uppercase">Market cap</div>
											<div style="font-size:18px">${usdMc != null ? '$' + Number(usdMc).toLocaleString(undefined, { maximumFractionDigits: 0 }) : 'n/a'}</div>
										</div>
										<div>
											<div class="dash-muted" style="font-size:11px;text-transform:uppercase">SOL in curve</div>
											<div style="font-size:18px">${Number.isFinite(solBalance) ? solBalance.toFixed(2) : 'n/a'}</div>
										</div>
										<div>
											<div class="dash-muted" style="font-size:11px;text-transform:uppercase">Tokens left</div>
											<div style="font-size:18px">${Number.isFinite(tokensLeft) ? tokensLeft.toLocaleString(undefined, { maximumFractionDigits: 0 }) : 'n/a'}</div>
										</div>
										<div>
											<div class="dash-muted" style="font-size:11px;text-transform:uppercase">Status</div>
											<div style="font-size:18px">${complete ? '🎓 Graduated' : '📈 Bonding'}</div>
										</div>
									</div>
								</div>`
							: token.cluster === 'mainnet'
								? '<div class="dash-empty">No live market data for this mint yet. A brand-new token can take a minute to appear; reload to try again.</div>'
								: '<div class="dash-muted" style="text-align:center;padding:12px">Devnet token — live Pump.fun stats are mainnet-only.</div>'
					}

					<div class="dash-card">
						<h2>Launch tx</h2>
						${
							token.tx_signature
								? `<div class="dash-mono" style="word-break:break-all">${escapeHtml(token.tx_signature)}</div>
									<a class="dash-btn" style="margin-top:10px" target="_blank" rel="noopener" href="https://solscan.io/tx/${encodeURIComponent(token.tx_signature)}${token.cluster === 'devnet' ? '?cluster=devnet' : ''}">View on Solscan ↗</a>`
								: '<div class="dash-muted">No tx signature recorded.</div>'
						}
					</div>
				`;
			}

			mountAgentPicker({
				host: document.getElementById('picker'),
				onPick: (agentId) => render(agentId),
			});
		</script>
		<script src="/brand.js" defer></script>
	<!-- Runtime i18n: detects locale, swaps annotated copy, mounts <lang-switcher>. -->
	<script type="module" src="/i18n.js"></script>
</body>
</html>

substitutions:
  _REGION: us-central1
  _RUN_SA: avatar-reconstruction-sa@aerial-vehicle-466722-p5.iam.gserviceaccount.com
  _SERVICE: model-lato2
  _REPO: model-lato2
  _GCS_BUCKET: three-ws-avatar-reconstructions
  _WEIGHTS_BUCKET: three-ws-model-weights
  _WEIGHTS_BUCKET_PREFIX: lato2
  # Scale-to-zero: the us-central1 L4 grant is shared by every GPU lane
  # (docs/ops/gcp-credits-plan.md). A cold start pays the 3.6 GB checkpoint sync
  # from the weights bucket, then model load per job; callers treat this lane as
  # best-effort and fall back to QuadriFlow, so a cold start never blocks export.
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "2"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: workers/model-lato2
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUN_SA}
      - --platform=managed
      - --port=8080
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --no-gpu-zonal-redundancy
      - --no-cpu-throttling
      - --cpu=8
      - --memory=24Gi
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --timeout=600
      - --allow-unauthenticated
      - --set-env-vars=GCS_BUCKET=${_GCS_BUCKET},MAX_CONCURRENT=1,WEIGHTS_GCS_URI=gs://${_WEIGHTS_BUCKET}/${_WEIGHTS_BUCKET_PREFIX}
      - --set-secrets=API_KEY=avatar-reconstruction-key:latest
      # weights_sync.py downloads the checkpoints before uvicorn binds, so the
      # startup probe has to outlast that download.
      - --startup-probe=httpGet.path=/health,initialDelaySeconds=10,periodSeconds=10,timeoutSeconds=5,failureThreshold=60

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

# CUDA extension compiles (nvdiffrast, CuMesh, FlexGEMM, o-voxel) push the image
# build well past Cloud Build's 10-minute default. Give it an hour.
timeout: 3600s

# The project's default compute SA was deleted: builds must pin the dedicated
# build account or submits fail with "Unknown service account".
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

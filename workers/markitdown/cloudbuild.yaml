# Builds run as the pinned three-ws-build service account: the project's default
# compute service account was deleted, so an unpinned submit fails with
# "Unknown service account".
#
# The docker build runs test_policy.py and test_convert.py as a gate, so a
# conversion or hardening regression fails the build before anything is pushed.
#
# Deploy (owner step):
#   gcloud artifacts repositories create markitdown --repository-format=docker \
#     --location=us-central1   # first time only
#   gcloud builds submit --config workers/markitdown/cloudbuild.yaml \
#     --substitutions=SHORT_SHA=$(git rev-parse --short HEAD) .
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

substitutions:
  _REGION: us-central1
  _RUN_SA: avatar-reconstruction-sa@aerial-vehicle-466722-p5.iam.gserviceaccount.com
  _SERVICE: markitdown
  _REPO: markitdown
  # Scale to zero: ingestion is an occasional upload, and a slim Python image
  # cold-starts in a few seconds, well inside the upload's own progress bar.
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "3"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: workers/markitdown
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUN_SA}
      - --platform=managed
      - --port=8080
      - --cpu=2
      # Two conversion children at once, each capped at 3 GiB of address space.
      - --memory=8Gi
      - --concurrency=8
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --timeout=120
      - --allow-unauthenticated
      - --set-env-vars=MAX_CONCURRENT=2,CONVERT_TIMEOUT_SECONDS=45
      - --set-secrets=API_KEY=avatar-reconstruction-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

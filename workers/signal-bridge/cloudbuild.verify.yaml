# Build-and-smoke verification for the signal-bridge image.
#
# cloudbuild.yaml (the real one) ends in `gcloud run deploy`, and deploys are
# owner-gated. This config builds the SAME Dockerfile from the SAME context,
# then boots it with an empty /state (no Signal number registered) and runs
# smoke.sh against the HTTP surface the Cloud Run startup probe and the gateway
# rely on. Nothing is pushed to Artifact Registry, no bucket is created, nothing
# is deployed, and no number is registered.
#
#   gcloud builds submit workers/signal-bridge \
#     --config workers/signal-bridge/cloudbuild.verify.yaml \
#     --region us-central1 --project aerial-vehicle-466722-p5

# The project's default compute service account was deleted, so an unpinned
# submit fails with "Unknown service account".
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    # The Dockerfile uses COPY --chmod, which the legacy builder rejects.
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '--tag', 'signal-bridge:verify', '.']
    timeout: 900s

  - id: smoke
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['smoke.sh', 'signal-bridge:verify']
    timeout: 300s

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1300s

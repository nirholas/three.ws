# Build-only verification for the agent-gateway image.
#
# cloudbuild.yaml (the real one) ends in `gcloud run deploy`, and deploys are
# owner-gated, so this proves the image builds without shipping it. It runs the
# SAME Dockerfile against the SAME repo-root context and stops before push and
# deploy: nothing is tagged in Artifact Registry, nothing is deployed, no
# service changes. The Dockerfile's last step runs scripts/image-selfcheck.mjs
# as the runtime user, so a SUCCESS here also means the module graph resolves
# after the prune and ffmpeg can produce Ogg Opus voice notes.
#
#   gcloud builds submit . \
#     --config workers/agent-gateway/cloudbuild.verify.yaml \
#     --ignore-file workers/agent-gateway/verify.gcloudignore \
#     --region us-central1 --project aerial-vehicle-466722-p5
#
# Building locally is not a substitute: the root install is 3000+ packages and
# the workspace SDK builds need more memory than a dev container has.

# The project's default compute service account was deleted, so an unpinned
# submit fails with "Unknown service account".
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --file
      - workers/agent-gateway/Dockerfile
      - --tag
      - agent-gateway:verify
      - .
    timeout: 2400s

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 2500s

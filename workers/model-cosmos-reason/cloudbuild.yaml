# Deploy the Forge physical-plausibility judge: NVIDIA Cosmos Reason 2 8B on vLLM,
# as a scale-to-zero Cloud Run service on one L4.
#
#   TMPDIR=/home/user/.cache/gcloud-tmp gcloud builds submit \
#     --config workers/model-cosmos-reason/cloudbuild.yaml \
#     --project aerial-vehicle-466722-p5 workers/model-cosmos-reason
#
# Then point the API at it (the judge is dormant until this is set):
#
#   gcloud run services update three-ws-api --region us-central1 \
#     --project aerial-vehicle-466722-p5 \
#     --update-env-vars COSMOS_REASON_URL=$(gcloud run services describe model-cosmos-reason \
#       --region europe-west4 --project aerial-vehicle-466722-p5 --format='value(status.url)')
#
# Prerequisite: the weights are staged (cloudbuild.weights.yaml).
# Eval, shadow mode and the promotion flag: docs/forge-pipeline.md.
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

substitutions:
  # europe-west4 has L4 quota; us-central1's three L4s are held by model-trellis and
  # model-rig. The weights bucket is us-central1, the same cross-region FUSE read
  # granite-guardian does in this region.
  _REGION: europe-west4
  _SERVICE: model-cosmos-reason
  _REPO: model-cosmos-reason
  _RUN_SA: avatar-reconstruction-sa@aerial-vehicle-466722-p5.iam.gserviceaccount.com
  _WEIGHTS_BUCKET: three-ws-model-weights
  _VLLM_TAG: v0.29.0
  # Scale to zero: the judge runs in shadow (or as a fail-open tie-breaker), so a
  # cold start costs a missing shadow verdict, never a failed generation.
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "2"

steps:
  - id: weights-staged
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud storage cat "gs://${_WEIGHTS_BUCKET}/cosmos-reason2-8b/MANIFEST.json" >/dev/null \
          || { echo "weights are not staged: run cloudbuild.weights.yaml first"; exit 1; }
        # The build SA cannot create repositories; the repo is a one-time setup
        # done by an operator (created 2026-11-16).
        gcloud artifacts repositories describe ${_REPO} --location=${_REGION} >/dev/null 2>&1 \
          || { echo "create the registry once: gcloud artifacts repositories create ${_REPO} --repository-format=docker --location=${_REGION}"; exit 1; }

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=VLLM_IMAGE=vllm/vllm-openai:${_VLLM_TAG}
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/model-cosmos-reason:$BUILD_ID
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/model-cosmos-reason:$BUILD_ID"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/model-cosmos-reason:$BUILD_ID
      - --region=${_REGION}
      - --service-account=${_RUN_SA}
      - --platform=managed
      - --port=8080
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --no-gpu-zonal-redundancy
      - --no-cpu-throttling
      - --cpu=8
      - --memory=32Gi
      - --concurrency=8
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --timeout=300
      # vLLM's own bearer check (VLLM_API_KEY) gates every /v1 route, the same
      # model as the other vLLM workers; /health stays open for the probe.
      - --allow-unauthenticated
      - --labels=lane=cosmos-reason-judge,program=gcp-credits
      - --add-volume=name=weights,type=cloud-storage,bucket=${_WEIGHTS_BUCKET},readonly=true
      - --add-volume-mount=volume=weights,mount-path=/weights
      # 17.5 GB over a cross-region FUSE read plus torch.compile and CUDA graph
      # capture. serve.sh prefetches the shards; the 30 minute ceiling is the
      # margin for a slow cross-region read (lazy mmap reads needed 13.5 minutes
      # for the shards alone and failed a 15 minute probe on 2026-11-16).
      - --startup-probe=httpGet.path=/health,httpGet.port=8080,periodSeconds=20,timeoutSeconds=5,failureThreshold=90
      - --set-secrets=VLLM_API_KEY=avatar-reconstruction-key:latest

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

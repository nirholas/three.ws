# Stage NVIDIA Cosmos Reason 2 8B (NVIDIA Open Model License) from the NGC model
# registry into the shared weights bucket, checksummed against NGC's SHA-256 record.
#
#   TMPDIR=/home/user/.cache/gcloud-tmp gcloud builds submit \
#     --config workers/model-cosmos-reason/cloudbuild.weights.yaml \
#     --project aerial-vehicle-466722-p5 workers/model-cosmos-reason
#
# Re-runs exit early when gs://.../REVISION already names the pinned version.
# serve.sh checks MANIFEST.json at every cold start, so a partial sync can never
# serve traffic.
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

substitutions:
  _WEIGHTS_BUCKET: three-ws-model-weights
  # Pinned NGC version: an upstream re-upload must not change verdicts without a deploy.
  _NGC_VERSION: hf-0303
  _WEIGHTS_PATH: cosmos-reason2-8b

availableSecrets:
  secretManager:
    - versionName: projects/aerial-vehicle-466722-p5/secrets/nvidia-api-key/versions/latest
      env: NGC_API_KEY

steps:
  - id: check-weights
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if gcloud storage cat "gs://${_WEIGHTS_BUCKET}/${_WEIGHTS_PATH}/REVISION" 2>/dev/null | grep -qx "${_NGC_VERSION}"; then
          echo "weights already staged on ${_NGC_VERSION}"
          touch /workspace/weights-staged
        fi

  - id: download-and-verify
    name: python:3.12-slim
    entrypoint: bash
    secretEnv: [NGC_API_KEY]
    args:
      - -ceu
      - |
        [ -f /workspace/weights-staged ] && exit 0
        python3 stage_weights.py --version "${_NGC_VERSION}" --out /workspace/weights

  - id: upload-weights
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        [ -f /workspace/weights-staged ] && exit 0
        # REVISION goes last: its presence is what marks the tree complete.
        mv /workspace/weights/REVISION /workspace/REVISION
        gcloud storage rsync --recursive --delete-unmatched-destination-objects \
          --exclude='^REVISION$' /workspace/weights "gs://${_WEIGHTS_BUCKET}/${_WEIGHTS_PATH}"
        gcloud storage cp /workspace/REVISION "gs://${_WEIGHTS_BUCKET}/${_WEIGHTS_PATH}/REVISION"

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

# Build-only verification: builds the same Dockerfile, runs its in-image pytest and
# import check, and stops before any push. Nothing is tagged in Artifact Registry.
#
#   TMPDIR=/home/user/.cache/gcloud-tmp gcloud builds submit workers/model-panodepth \
#     --config workers/model-panodepth/cloudbuild.verify.yaml --region us-central1 --project aerial-vehicle-466722-p5

serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

substitutions:
  _WEIGHTS_BUCKET: three-ws-model-weights

steps:
  - id: weights
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p weights/moge-2-vitl-normal
        gcloud storage cp gs://${_WEIGHTS_BUCKET}/panodepth/moge-2-vitl-normal/model.pt weights/moge-2-vitl-normal/model.pt
        echo "280741fd09bc3f403ccff9967784c2a391b52d2c0742ae3efdb21d9f90cc1a01  model.pt" > weights/moge-2-vitl-normal/SHA256SUMS

  - id: build
    name: gcr.io/cloud-builders/docker
    args: [build, --tag, "model-panodepth:verify", "."]
    timeout: 3000s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

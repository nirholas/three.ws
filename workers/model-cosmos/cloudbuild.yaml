# Build and deploy the Cosmos world worker on a Cloud Run RTX PRO 6000.
#
#   TMPDIR=/home/user/.cache/gcloud-tmp gcloud builds submit workers/model-cosmos \
#     --config workers/model-cosmos/cloudbuild.yaml \
#     --project aerial-vehicle-466722-p5 --region us-central1 \
#     --substitutions=SHORT_SHA=$(git rev-parse --short HEAD)
#
# Weights are staged once by cloudbuild.stage.yaml into the europe-west4
# weights bucket and read through a gcsfuse mount, so the image stays small.
substitutions:
  _REGION: europe-west4
  _SERVICE: model-cosmos
  _REPO: model-cosmos
  _RUN_SA: avatar-reconstruction-sa@aerial-vehicle-466722-p5.iam.gserviceaccount.com
  _WEIGHTS_BUCKET: three-ws-model-weights-euw4
  _TASK_BUCKET: three-ws-cosmos-worker-euw4
  # Scale to zero between worlds: /cosmos is an on-demand lane, and a cold
  # start (one ~35 GB checkpoint load) is reported to the caller as queued.
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "1"

steps:
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest || exit 0

  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server"]

  # Same GPU-quota dance as the other RTX lanes: release the GPU with manual
  # scaling at 0, deploy, then restore autoscaling even if the deploy failed.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        gcloud run services update ${_SERVICE} --region=${_REGION} --scaling=0 --quiet 2>/dev/null || true
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA \
          --region=${_REGION} \
          --service-account=${_RUN_SA} \
          --port=8080 \
          --gpu=1 \
          --gpu-type=nvidia-rtx-pro-6000 \
          --no-gpu-zonal-redundancy \
          --no-cpu-throttling \
          --cpu=20 \
          --memory=80Gi \
          --concurrency=8 \
          --min-instances=${_MIN_INSTANCES} \
          --max-instances=${_MAX_INSTANCES} \
          --timeout=900 \
          --startup-probe=tcpSocket.port=8080,initialDelaySeconds=0,periodSeconds=10,failureThreshold=24,timeoutSeconds=5 \
          --allow-unauthenticated \
          --add-volume=name=weights,type=cloud-storage,bucket=${_WEIGHTS_BUCKET},readonly=true \
          --add-volume-mount=volume=weights,mount-path=/weights \
          '--update-env-vars=^;^MODEL_DIR=/weights/cosmos3-nano;TASK_BUCKET=${_TASK_BUCKET};TASK_PREFIX=cosmos-worker;DEFAULT_RESOLUTION=720' \
          --update-secrets=API_KEY=cosmos-worker-key:latest,NVIDIA_API_KEY=nvidia-api-key:latest \
          --quiet
        deployed=$$?
        gcloud run services update ${_SERVICE} --region=${_REGION} --scaling=auto --min=${_MIN_INSTANCES} --max=${_MAX_INSTANCES} --quiet
        restored=$$?
        if [ "$$deployed" -ne 0 ]; then exit "$$deployed"; fi
        exit "$$restored"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com
timeout: 3600s

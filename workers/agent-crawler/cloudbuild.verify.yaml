# Build-only verification for the agent-crawler image. Builds the same Dockerfile the real
# cloudbuild.yaml builds and stops before push and deploy: nothing is tagged in
# Artifact Registry and no service changes. Owner-gated deploys stay untouched.
#
#   gcloud builds submit workers/agent-crawler --config workers/agent-crawler/cloudbuild.verify.yaml --region us-central1 --project aerial-vehicle-466722-p5

serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - agent-crawler:verify
      - .
    timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# One-off CPU job: stage the LongCat weights (about 45 GB) into
# gs://three-ws-model-weights/longcat/ and write weights.sha256 beside them.
# No GPU is involved. Run it in the background:
#
#   gcloud builds submit workers/longcat --config workers/longcat/cloudbuild-stage-weights.yaml \
#     --region us-central1 --project aerial-vehicle-466722-p5 --async
#
# The build disk holds the whole download, so it is sized well above 45 GB.
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com
steps:
  - id: download
    name: python:3.12-slim
    entrypoint: bash
    env:
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - LOCAL_DIR=/workspace/longcat-weights
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet 'huggingface_hub[cli]>=0.30,<1.0' hf_transfer
        bash stage-weights.sh --local-only
  - id: upload
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud storage rsync --recursive --exclude='(.*/)?\.cache/.*' \
          /workspace/longcat-weights gs://three-ws-model-weights/longcat
        gcloud storage du --summarize --readable-sizes gs://three-ws-model-weights/longcat
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
timeout: 7200s

# Cloud Build → Cloud Run for the Agora life engine (workers/agora-citizens).
#
# Background daemon: it runs the daily loop continuously and binds a tiny health
# endpoint on $PORT so the startup probe passes. Deployed with --no-cpu-throttling
# and --min-instances=1 so the loop keeps ticking between probes. Build context is
# the REPO ROOT (the Dockerfile compiles the @three-ws/solana-agent SDK).
#
# Runtime config mirrors three-ws-api: the DATABASE_URL secret (the same Neon
# projection sink the API reads), the shared Redis proxy on the private VPC range
# for the feed:events ticker, and the pinned three-ws@ runtime service account
# (the project's default compute SA was deleted, so an unpinned deploy fails).
# Every secret referenced below exists in Secret Manager and is readable by
# three-ws@ (a --update-secrets entry naming a missing secret fails the deploy):
#   DATABASE_URL                 the Neon projection sink
#   upstash-redis-rest-token     the shared Redis proxy (feed:events ticker)
#   agora-signer-seed            AGORA_SIGNER_SEED: every citizen and dispatcher
#                                keypair is derived from it, because a Cloud Run
#                                instance has no persistent disk for .cache/ and a
#                                restart would otherwise mint new signers for
#                                agents already registered under the old ones
#   agora-devnet-funder-secret   AGORA_DEVNET_FUNDER_SECRET: a devnet-only wallet
#                                the engine tops its signers up from (the public
#                                RPC faucet is closed). Fund its address at
#                                https://faucet.solana.com; never a mainnet key.
# AGENC_DEVNET_RPC_URL is optional and not wired: the engine falls back to the
# public devnet endpoint. To use a private devnet RPC, create the secret once and
# add it to --update-secrets.
#
# Env and secrets are applied with --update-*, never --set-*, so a key added to
# the live service by hand survives the next deploy.
#
# SHORT_SHA is only populated for trigger builds; a manual submit passes it:
#
#   gcloud builds submit --config workers/agora-citizens/cloudbuild.yaml \
#     --region us-central1 --project aerial-vehicle-466722-p5 \
#     --substitutions=SHORT_SHA=manual$(date +%s) .

# Builds run as the pinned three-ws-build service account: the project's default
# compute service account was deleted, so an unpinned submit fails with
# "Unknown service account".
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

# _REPO is the SHARED "workers" Artifact Registry repo the other long-lived Node
# workers (agent-mm, agent-orders, okx-chat-bot) publish into. Cloud Build does not
# create an Artifact Registry repo on demand, so a per-worker repo name that has
# never been created fails the push step after a full image build.
substitutions:
  _REGION: us-central1
  _SERVICE: agora-citizens
  _REPO: workers
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "1"
  _MAX_CITIZENS: "4"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - workers/agora-citizens/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .
    timeout: 1800s

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-cpu-throttling
      - --cpu=1
      - --memory=1Gi
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --no-allow-unauthenticated
      - --service-account=three-ws@$PROJECT_ID.iam.gserviceaccount.com
      # The feed:events ticker lives on the shared Redis proxy at a private VPC
      # address, so the worker needs the same connector three-ws-api uses. Without
      # it the REST calls simply never reach the proxy and the world loses its
      # live ticker (the projection still lands in Postgres).
      - --vpc-connector=three-ws-vpc
      - --vpc-egress=private-ranges-only
      # Top-up bands sized for funder-fed devnet signers: a signer under 0.05 SOL
      # is brought back to 0.1 SOL, which covers stake, rent, fees and the 0.001
      # SOL task rewards for many ticks without draining the funder.
      - --update-env-vars=AGORA_CLUSTER=devnet,AGORA_MAX_CITIZENS=${_MAX_CITIZENS},AGORA_DISPATCH_TASKS=1,AGORA_TOPUP_THRESHOLD_LAMPORTS=50000000,AGORA_FUNDER_TOPUP_LAMPORTS=50000000,UPSTASH_REDIS_REST_URL=http://10.128.15.228
      - --update-secrets=DATABASE_URL=DATABASE_URL:latest,UPSTASH_REDIS_REST_TOKEN=upstash-redis-rest-token:latest,AGORA_SIGNER_SEED=agora-signer-seed:latest,AGORA_DEVNET_FUNDER_SECRET=agora-devnet-funder-secret:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

# Florence-2 describe service on one L4, scale to zero. Deploy (owner step):
#   gcloud builds submit --config workers/model-florence2/cloudbuild.yaml \
#     --substitutions SHORT_SHA=$(git rev-parse --short HEAD) workers/model-florence2
# then wire the API:
#   gcloud run services update three-ws-api --region us-central1 \
#     --update-env-vars MODEL_FLORENCE2_URL=<service url>
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com

substitutions:
  _REGION: us-central1
  _RUN_SA: avatar-reconstruction-sa@aerial-vehicle-466722-p5.iam.gserviceaccount.com
  _SERVICE: model-florence2
  _REPO: model-florence2
  # Scale to zero: the describe cron is the only caller and tolerates a cold
  # start (weights are baked in, so a cold start is the model load, ~20 s).
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "1"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUN_SA}
      - --platform=managed
      - --port=8080
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --no-gpu-zonal-redundancy
      - --no-cpu-throttling
      - --cpu=4
      - --memory=16Gi
      - --concurrency=4
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --timeout=120
      - --allow-unauthenticated
      - --startup-probe=httpGet.path=/health,periodSeconds=10,failureThreshold=30,timeoutSeconds=5
      - --set-secrets=API_KEY=avatar-reconstruction-key:latest

timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

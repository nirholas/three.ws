<!doctype html>
<html lang="en">
	<head>
		<script>
			(function () {
				document.documentElement.classList.add('js');
				try {
					var m = localStorage.getItem('twx_theme');
					var l = m === 'auto' ? window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches : m === 'light';
					document.documentElement.setAttribute('data-theme', l ? 'light' : 'dark');
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>MCP Plans · three.ws</title>
		<meta name="description" content="Prepay for paid three.ws MCP tools with credit bundles or time passes, try each tool free, and see every credit spent." />
		<meta property="og:title" content="MCP Plans · three.ws" />
		<meta property="og:url" content="https://three.ws/mcp-plans" />
		<link rel="canonical" href="https://three.ws/mcp-plans" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="stylesheet" href="/style.css" />
		<link rel="stylesheet" href="/nav.css" />
		<link rel="stylesheet" href="/footer.css" />
		<link rel="stylesheet" href="/fonts/fonts.css" />
		<link rel="stylesheet" href="/mobile.css" />
		<style>
			.mp-wrap { max-width: 1040px; width: 100%; min-width: 0; margin: 0 auto; padding: clamp(1.25rem, 4vw, 3rem) 1.25rem 4rem; }
			.mp-wrap h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); margin: 0 0 0.35rem; letter-spacing: -0.02em; }
			.mp-lede { margin: 0 0 1.75rem; color: var(--ink-dim, #9aa3b2); max-width: 60ch; line-height: 1.5; }
			.mp-card { background: var(--surface-1, #14161c); border: 1px solid var(--stroke, #262a33); border-radius: 16px; padding: 1.25rem 1.35rem; min-width: 0; }
			.mp-card h2 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-dim, #9aa3b2); margin: 0 0 0.9rem; font-weight: 600; }
			.mp-section { margin-top: 1.1rem; }
			.mp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
			.mp-balance { font-size: clamp(2.4rem, 7vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
			.mp-sub { margin-top: 0.6rem; color: var(--ink-dim, #9aa3b2); font-size: 0.9rem; overflow-wrap: anywhere; }
			.mp-plan h3 { margin: 0 0 0.25rem; font-size: 1.1rem; overflow-wrap: anywhere; }
			.mp-price { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 0.4rem 0; }
			.mp-plan p { margin: 0 0 1rem; color: var(--ink-dim, #9aa3b2); font-size: 0.9rem; line-height: 1.45; }
			.mp-btn { font: inherit; font-weight: 600; padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--stroke, #262a33); background: var(--accent, #6d5efc); color: #fff; cursor: pointer; width: 100%; transition: filter 0.15s, transform 0.05s; }
			.mp-btn:hover:not(:disabled) { filter: brightness(1.12); }
			.mp-btn:active:not(:disabled) { transform: translateY(1px); }
			.mp-btn:focus-visible, .mp-link:focus-visible { outline: 2px solid var(--accent, #6d5efc); outline-offset: 2px; }
			.mp-btn:disabled { opacity: 0.55; cursor: not-allowed; }
			.mp-link { color: var(--accent, #6d5efc); }
			.mp-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
			.mp-table th, .mp-table td { text-align: left; padding: 0.5rem 0.6rem 0.5rem 0; border-bottom: 1px solid var(--stroke, #262a33); overflow-wrap: anywhere; }
			.mp-table th { color: var(--ink-dim, #9aa3b2); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
			.mp-table td.num, .mp-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
			.mp-scroll { overflow-x: auto; }
			.mp-empty, .mp-error { padding: 1rem; border-radius: 12px; border: 1px dashed var(--stroke, #262a33); color: var(--ink-dim, #9aa3b2); }
			.mp-error { border-style: solid; border-color: #d9534f; color: inherit; }
			.mp-skel { height: 110px; border-radius: 12px; background: linear-gradient(90deg, var(--surface-1, #14161c), var(--stroke, #262a33), var(--surface-1, #14161c)); background-size: 200% 100%; animation: mp-shimmer 1.4s linear infinite; }
			@keyframes mp-shimmer { to { background-position: -200% 0; } }
			@media (prefers-reduced-motion: reduce) { .mp-skel { animation: none; } }
		</style>
	</head>
	<body>
		<a href="#main-content" class="h-skip-link">Skip to main content</a>
		<header><div id="nav-container"></div></header>
		<script src="/nav.js"></script>

		<main id="main-content" class="mp-wrap">
			<h1>MCP plans</h1>
			<p class="mp-lede">
				Prepay for paid three.ws MCP tools. A credit is worth $0.001 of a tool's per-call price. Time passes cover every
				paid tool without counting calls. Every account also gets free trial calls on each tool. When a plan runs out, calls fall back to
				pay-per-call over x402.
			</p>
			<div id="mp-root" aria-live="polite">
				<div class="mp-skel"></div>
			</div>
		</main>

		<script src="/brand.js" defer></script>
		<div id="footer-container"></div>
		<script src="/footer.js"></script>
		<script type="module" src="/src/mcp-plans.js"></script>
	</body>
</html>

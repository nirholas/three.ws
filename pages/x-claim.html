<!DOCTYPE html>
<html lang="en">
<head>
	<script>/* three.ws theme boot: no-flash */(function(){try{var m=localStorage.getItem('twx_theme');var l=m==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches):m==='light';document.documentElement.setAttribute('data-theme',l?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Claim your X creations · three.ws</title>
	<meta name="description" content="Models and avatars the three.ws bot made for you on X wait here. Link the same X account and they move into your library." />
	<link rel="canonical" href="https://three.ws/x/claim" />
	<link rel="icon" href="/favicon.ico" sizes="any" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/manifest.webmanifest" />
	<link rel="stylesheet" href="/style.css" />
	<link rel="stylesheet" href="/nav.css" />
	<link rel="stylesheet" href="/mobile.css" />
	<meta property="og:type" content="website" />
	<meta property="og:title" content="Claim your X creations" />
	<meta property="og:description" content="Models and avatars the three.ws bot made for you on X move into your library when you link your X account." />
	<meta property="og:url" content="https://three.ws/x/claim" />
	<meta property="og:image" content="https://three.ws/og-image.png" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:site" content="@trythreews" />
	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; background: var(--bg-0); color: var(--ink); }
		body { font-family: var(--font-body, 'Inter', system-ui, sans-serif); min-height: 100vh; }
		a { color: inherit; }
		.xc-wrap { max-width: 760px; margin: 0 auto; padding: 44px 18px 96px; }
		.xc-eyebrow { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 650; margin: 0 0 10px; }
		.xc-wrap h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.08; margin: 0 0 12px; letter-spacing: -0.03em; color: var(--ink-bright, var(--ink)); }
		.xc-lede { margin: 0 0 24px; max-width: 58ch; color: var(--ink-dim); line-height: 1.6; }
		.xc-panel { border: 1px solid var(--stroke-strong); border-radius: var(--radius-lg, 14px); background: var(--surface-2, rgba(255,255,255,0.05)); padding: 20px; }
		.xc-panel h2 { margin: 0 0 6px; font-size: 1.1rem; color: var(--ink-bright, var(--ink)); }
		.xc-panel p { margin: 0 0 14px; color: var(--ink-dim); line-height: 1.55; }
		.xc-actions { display: flex; flex-wrap: wrap; gap: 10px; }
		.xc-btn {
			display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; font: inherit; font-size: 0.92rem; font-weight: 650;
			color: var(--ink); text-decoration: none; cursor: pointer; border-radius: var(--radius-md, 10px); border: 1px solid var(--stroke-strong); background: transparent;
			transition: background var(--duration-fast, 140ms) ease, border-color var(--duration-fast, 140ms) ease, transform var(--duration-fast, 140ms) ease;
		}
		.xc-btn:hover { background: var(--surface-2, rgba(255,255,255,0.08)); border-color: var(--ink-faint, var(--stroke-strong)); }
		.xc-btn:active { transform: translateY(1px); }
		.xc-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		.xc-btn[data-variant="primary"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink, #000); }
		.xc-btn[data-variant="primary"]:hover { filter: brightness(1.1); }
		.xc-btn:disabled { opacity: 0.55; cursor: not-allowed; }
		.xc-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
		.xc-head h2 { margin: 0; }
		.xc-list { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 10px; }
		.xc-item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--stroke); border-radius: var(--radius-md, 10px); background: var(--bg-1, rgba(0,0,0,0.2)); animation: xc-in var(--duration-base, 180ms) ease both; }
		.xc-thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--surface-2, rgba(255,255,255,0.06)); }
		.xc-prompt { margin: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; color: var(--ink-bright, var(--ink)); }
		.xc-when { display: block; font-size: 0.76rem; color: var(--ink-faint, var(--ink-dim)); margin-top: 2px; }
		.xc-skel { height: 84px; border-radius: var(--radius-md, 10px); background: linear-gradient(90deg, var(--surface-2, rgba(255,255,255,0.05)), var(--surface-3, rgba(255,255,255,0.1)), var(--surface-2, rgba(255,255,255,0.05))); background-size: 200% 100%; animation: xc-shimmer 1.2s linear infinite; }
		.xc-status { margin: 12px 0 0; font-size: 0.9rem; min-height: 1.3em; }
		.xc-status[data-tone="error"] { color: var(--danger, #f87171); }
		.xc-status[data-tone="ok"] { color: var(--success, #4ade80); }
		@keyframes xc-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
		@keyframes xc-shimmer { to { background-position: -200% 0; } }
		@media (prefers-reduced-motion: reduce) { .xc-item, .xc-skel { animation: none; } .xc-btn { transition: none; } }
		@media (max-width: 480px) { .xc-item { grid-template-columns: 52px minmax(0, 1fr); } .xc-item .xc-btn { grid-column: 1 / -1; } .xc-thumb { width: 52px; height: 52px; } }
	</style>
</head>
<body>
	<script src="/nav.js"></script>
	<main class="xc-wrap" id="main">
		<p class="xc-eyebrow">From X</p>
		<h1>Claim what the bot made for you.</h1>
		<p class="xc-lede">When you ask @trythreews for a 3D model, an avatar, or a model from your photo, the result is saved here. Link the same X account and every one of them moves into your library.</p>
		<div id="xc-root" aria-live="polite" aria-busy="true">
			<div class="xc-skel" role="status" aria-label="Loading"></div>
		</div>
	</main>

	<script type="module" src="/src/x-claim.js"></script>
	<script src="/brand.js" defer></script>
	<script type="module" src="/i18n.js"></script>
</body>
</html>

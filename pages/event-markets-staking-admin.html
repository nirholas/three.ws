<!DOCTYPE html>
<html lang="en">
<head>
	<script>/* three.ws theme boot: no-flash */(function(){try{var m=localStorage.getItem('twx_theme');var l=m==='auto'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches):m==='light';document.documentElement.setAttribute('data-theme',l?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="robots" content="noindex" />
	<title>Staking reconciliation · Event Markets · three.ws</title>
	<meta name="description" content="Admin view of every staked pool: vault balance against on-chain totals and recorded stakes, plus the instant stake kill switch." />
	<link rel="icon" href="/favicon.ico" sizes="any" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="stylesheet" href="/style.css" />
	<link rel="stylesheet" href="/nav.css" />
	<link rel="stylesheet" href="/mobile.css" />
	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; background: var(--bg-0); color: var(--ink); }
		body { font-family: var(--font-body, 'Inter', system-ui, sans-serif); min-height: 100vh; }
		.emq { max-width: 880px; margin: 0 auto; padding: 44px 18px 96px; }
		.emq h1 { font-size: clamp(1.6rem, 4.5vw, 2.3rem); margin: 0 0 8px; letter-spacing: -0.03em; color: var(--ink-bright, var(--ink)); }
		.emq-lede { margin: 0 0 20px; color: var(--ink-dim); line-height: 1.55; max-width: 62ch; }
		.emq-flag { border: 1px solid var(--stroke-strong); border-radius: 10px; padding: 10px 14px; margin: 0 0 18px; font-size: 0.9rem; color: var(--ink-dim); }
		.emq-flag[data-on="true"] { border-color: var(--accent); color: var(--ink); }
		.emq-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
		.emq-tab, .emq-btn { font: inherit; font-size: 0.88rem; font-weight: 600; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--stroke-strong); background: transparent; color: var(--ink); cursor: pointer; transition: background 140ms ease, border-color 140ms ease; }
		.emq-tab:hover, .emq-btn:hover { background: var(--surface-2, rgba(255,255,255,0.06)); }
		.emq-tab:active, .emq-btn:active { transform: translateY(1px); }
		.emq-tab:focus-visible, .emq-btn:focus-visible, .emq textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		.emq-tab[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
		.emq-btn[data-primary] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink, #000); }
		.emq-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
		.emq-spacer { flex: 1; }
		.emq-card { border: 1px solid var(--stroke-strong); border-radius: 14px; background: var(--surface-2, rgba(255,255,255,0.04)); padding: 16px; margin: 0 0 12px; }
		.emq-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 10px; font-size: 0.82rem; color: var(--ink-dim); }
		.emq-head a { color: var(--accent); text-decoration: none; font-weight: 600; }
		.emq-head a:hover { text-decoration: underline; }
		.emq-kind { text-transform: uppercase; letter-spacing: 0.07em; font-weight: 650; font-size: 0.72rem; }
		.emq-text { white-space: pre-wrap; word-break: break-word; line-height: 1.5; margin: 0 0 10px; }
		.emq textarea { width: 100%; min-height: 120px; font: inherit; color: var(--ink); background: var(--bg-0); border: 1px solid var(--stroke-strong); border-radius: 10px; padding: 10px; resize: vertical; }
		.emq-meta { font-size: 0.8rem; color: var(--ink-dim); margin: 0 0 10px; }
		.emq-actions { display: flex; flex-wrap: wrap; gap: 8px; }
		.emq-note { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--stroke-strong); font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; }
		.emq-note[data-error] { border-color: #d9534f; }
		.emq-empty { border: 1px dashed var(--stroke-strong); border-radius: 14px; padding: 28px; text-align: center; color: var(--ink-dim); line-height: 1.6; }
		.emq-skel { height: 118px; border-radius: 14px; margin: 0 0 12px; background: linear-gradient(90deg, var(--surface-2, rgba(255,255,255,0.04)), var(--stroke-strong), var(--surface-2, rgba(255,255,255,0.04))); background-size: 200% 100%; animation: emq-shimmer 1.4s linear infinite; }
		@keyframes emq-shimmer { to { background-position: -200% 0; } }
		@media (prefers-reduced-motion: reduce) { .emq-skel { animation: none; } }
			.emq-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 16px; margin: 8px 0 0; font-size: 0.84rem; }
		.emq-kv dt { color: var(--ink-dim); } .emq-kv dd { margin: 0 0 6px; font-variant-numeric: tabular-nums; word-break: break-all; }
		.emq-status { font-weight: 700; } .emq-status[data-ok="false"] { color: #d9534f; }
	</style>
</head>
<body>
	<script src="/nav.js"></script>
	<main class="emq">
		<h1>Staking reconciliation</h1>
		<p class="emq-lede">Each pool's vault balance against the program's totals and the stakes this site recorded. The kill switch stops new stakes instantly. Claims and refunds are never blocked.</p>
		<div class="emq-flag" id="flag" role="status"></div>
		<div class="emq-bar">
			<button class="emq-btn" id="refresh" type="button">Reconcile now</button>
			<span class="emq-spacer"></span>
			<button class="emq-btn" data-primary id="toggle" type="button" disabled>Pause new stakes</button>
		</div>
		<div id="list" aria-live="polite"></div>
	</main>
	<script type="module">
		const state = { csrf: null, data: null };
		const $ = (id) => document.getElementById(id);
		const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); for (const k of kids) n.append(k); return n; };
		const unwrap = async (r) => {
			const j = await r.json().catch(() => ({}));
			if (!r.ok) throw new Error(j.error_description || j.message || `request failed (${r.status})`);
			return j.data || j;
		};
		async function csrf() {
			if (state.csrf) return state.csrf;
			const j = await fetch('/api/csrf-token', { credentials: 'include' }).then((r) => r.json()).catch(() => ({}));
			state.csrf = j.data?.token || j.token || null;
			return state.csrf;
		}
		function problemText(p) {
			const map = {
				vault_short: 'Vault holds less than the program owes. Pause stakes and investigate.',
				vault_surplus: 'Vault holds more than expected (tokens sent outside the program).',
				ledger_stake_mismatch: 'Recorded stakes differ from on-chain total.',
				ledger_payout_mismatch: 'Recorded payouts differ from on-chain paid out.',
				pool_missing_on_chain: 'Pool account not found on chain.',
				chain_unreachable: 'RPC unreachable',
			};
			return `${map[p.code] || p.code}${p.delta ? ` (delta ${p.delta})` : ''}${p.message ? `: ${p.message}` : ''}`;
		}
		function card(p) {
			const c = el('article', { className: 'emq-card' });
			const head = el('div', { className: 'emq-head' });
			head.append(p.slug ? el('a', { href: `/event-markets/${encodeURIComponent(p.slug)}`, textContent: p.title || p.slug }) : el('span', { textContent: p.market_id }));
			head.append(el('span', { className: 'emq-kind', textContent: `${p.token} on ${p.cluster}` }));
			head.append(el('span', { textContent: `db ${p.status} / chain ${p.chain_status || 'unknown'}` }));
			const s = el('span', { className: 'emq-status', textContent: p.ok ? 'Balanced' : 'Needs attention' });
			s.dataset.ok = String(!!p.ok);
			head.append(s);
			c.append(head);
			if (p.expected_vault !== undefined) {
				const kv = el('dl', { className: 'emq-kv' });
				for (const [k, v] of [['Vault', p.vault], ['Expected vault', p.expected_vault], ['Chain staked', p.chain_total_staked], ['Ledger staked', p.ledger_staked], ['Chain paid out', p.chain_paid_out], ['Ledger paid out', p.ledger_paid_out], ['Pool', p.pool_address]]) {
					kv.append(el('dt', { textContent: k }), el('dd', { textContent: v }));
				}
				c.append(kv);
			}
			for (const pr of p.problems || []) {
				const n = el('p', { className: 'emq-note', textContent: problemText(pr) });
				n.setAttribute('data-error', ''); n.setAttribute('role', 'alert');
				c.append(n);
			}
			return c;
		}
		function render() {
			const d = state.data;
			$('flag').dataset.on = String(d.stakes_enabled && d.flag_enabled);
			$('flag').textContent = `Feature flag ${d.flag_enabled ? 'on' : 'off'} · cluster ${d.cluster} · new stakes ${d.stakes_enabled ? 'allowed' : 'PAUSED (kill switch)'}${d.onchain_paused ? ' · program also paused on chain' : ''}`;
			const t = $('toggle');
			t.disabled = false;
			t.textContent = d.stakes_enabled ? 'Pause new stakes' : 'Resume new stakes';
			const list = $('list');
			if (!d.pools.length) {
				list.replaceChildren(el('div', { className: 'emq-empty', textContent: 'No staked pools yet. A pool appears here once the owner creates one with scripts/event-markets-stake-admin.mjs create-pool.' }));
				return;
			}
			list.replaceChildren(...d.pools.map(card));
		}
		async function load() {
			$('list').replaceChildren(el('div', { className: 'emq-skel' }), el('div', { className: 'emq-skel' }));
			try {
				state.data = await unwrap(await fetch('/api/event-markets/staking-admin', { credentials: 'include' }));
				render();
			} catch (err) {
				const box = el('div', { className: 'emq-empty', textContent: `Could not load: ${err.message}. Sign in as an admin and reload.` });
				box.setAttribute('role', 'alert');
				$('list').replaceChildren(box);
			}
		}
		$('refresh').onclick = load;
		$('toggle').onclick = async () => {
			const t = $('toggle'); t.disabled = true;
			try {
				const token = await csrf();
				await unwrap(await fetch('/api/event-markets/staking-admin', {
					method: 'POST', credentials: 'include',
					headers: { 'content-type': 'application/json', ...(token ? { 'x-csrf-token': token } : {}) },
					body: JSON.stringify({ action: state.data.stakes_enabled ? 'pause' : 'resume' }),
				}));
				await load();
			} catch (err) { t.disabled = false; $('flag').textContent = `Switch failed: ${err.message}`; }
		};
		load();
	</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
	<style>[hidden]{display:none!important}</style>
	<script>/* Embed theme: the host page picks it with ?theme=, never the viewer's three.ws preference. */(function(){try{var t=new URLSearchParams(location.search).get('theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();</script>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Boost on DEXTools · three.ws</title>
	<meta name="description" content="An embeddable card that sends a token's community to its DEXTools pair page, where every visit counts toward DEXTools Social Boost." />
	<meta name="robots" content="noindex" />
	<link rel="canonical" href="https://three.ws/dextools" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<style>
		:root {
			color-scheme: dark;
			--bg: #0b0d12;
			--surface: #12151c;
			--stroke: rgba(255, 255, 255, 0.1);
			--ink: #e8ebf2;
			--ink-dim: #9aa3b5;
			--accent: #05a3ff;
			--accent-ink: #ffffff;
			--up: #22c55e;
			--down: #ef4444;
			--radius: 14px;
			--font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
		}
		:root[data-theme='light'] {
			color-scheme: light;
			--bg: #ffffff;
			--surface: #f5f7fb;
			--stroke: rgba(10, 20, 40, 0.12);
			--ink: #0f1420;
			--ink-dim: #5a6475;
			--accent: #0077cc;
			--up: #15803d;
			--down: #b91c1c;
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; }
		body {
			background: var(--bg); color: var(--ink); font-family: var(--font);
			font-size: 14px; line-height: 1.5; padding: 14px;
			display: flex; flex-direction: column; gap: 12px;
		}
		a { color: inherit; }
		a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

		.bx-token { display: flex; align-items: center; gap: 12px; min-width: 0; }
		.bx-logo {
			width: 44px; height: 44px; border-radius: 50%; flex: none; object-fit: cover;
			background: var(--surface); border: 1px solid var(--stroke);
			display: grid; place-items: center; font-weight: 700; color: var(--ink-dim);
		}
		.bx-id { min-width: 0; flex: 1; }
		.bx-name { margin: 0; font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.bx-sym { color: var(--ink-dim); font-weight: 500; margin-left: 6px; }
		.bx-mkt { margin: 2px 0 0; color: var(--ink-dim); font-variant-numeric: tabular-nums; font-size: 13px; }
		.bx-up { color: var(--up); }
		.bx-down { color: var(--down); }

		.bx-btn {
			display: inline-flex; align-items: center; justify-content: center; gap: 6px;
			padding: 8px 13px; border-radius: 10px; border: 1px solid var(--stroke);
			background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; font-weight: 550;
			text-decoration: none; cursor: pointer;
			transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
		}
		.bx-btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--stroke)); }
		.bx-btn:active { transform: translateY(1px); }
		.bx-btn:disabled { opacity: 0.6; cursor: default; }
		.bx-btn.is-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
		.bx-btn.is-primary:hover { background: color-mix(in srgb, var(--accent) 86%, #000); }

		.dtb { margin-top: 0 !important; }

		.bx-sent { margin: 0; color: var(--ink-dim); font-size: 12.5px; }
		.bx-sent b { color: var(--ink); font-variant-numeric: tabular-nums; }

		.bx-foot { margin-top: auto; display: flex; justify-content: flex-end; font-size: 11.5px; color: var(--ink-dim); }
		.bx-foot a { color: var(--ink-dim); text-decoration: none; }
		.bx-foot a:hover { color: var(--ink); text-decoration: underline; }

		.bx-skel { border-radius: 8px; background: linear-gradient(90deg, var(--surface) 0%, color-mix(in srgb, var(--ink) 8%, var(--surface)) 50%, var(--surface) 100%); background-size: 200% 100%; animation: bx-shimmer 1.2s linear infinite; }
		@keyframes bx-shimmer { to { background-position: -200% 0; } }
		@media (prefers-reduced-motion: reduce) { .bx-skel { animation: none; } }

		.bx-state { border: 1px solid var(--stroke); border-radius: var(--radius); background: var(--surface); padding: 16px; }
		.bx-state h1 { margin: 0 0 6px; font-size: 15px; }
		.bx-state p { margin: 0 0 12px; color: var(--ink-dim); }
		.bx-state code { font-family: ui-monospace, 'JetBrains Mono', monospace; font-size: 12px; }
	</style>
</head>
<body>
	<main id="bx" aria-busy="true">
		<div class="bx-token" aria-hidden="true">
			<div class="bx-logo bx-skel"></div>
			<div class="bx-id"><div class="bx-skel" style="height:16px;width:60%"></div><div class="bx-skel" style="height:12px;width:40%;margin-top:6px"></div></div>
		</div>
		<div class="bx-skel" style="height:150px;margin-top:12px" aria-hidden="true"></div>
	</main>
	<footer class="bx-foot"><a id="bx-attr" href="https://three.ws/dextools" target="_blank" rel="noopener">Boost card by three.ws</a></footer>
	<script type="module" src="/src/dextools-boost-embed.js"></script>
</body>
</html>

# Self-contained workspace so `cargo build-sbf` here never walks up into an
# unrelated parent workspace. Matches contracts/knock-escrow.
[workspace]

[package]
name = "event-markets-stake"
version = "0.1.0"
description = "Parimutuel staking pools for Event Markets: stake, lock, resolve, claim, and refund on void."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nirholas/three.ws"

[lib]
crate-type = ["cdylib", "lib"]
name = "event_markets_stake"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

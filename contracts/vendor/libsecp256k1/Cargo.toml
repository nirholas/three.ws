# libsecp256k1 0.6.0 from crates.io, vendored with one change: its rand
# dependency moves from 0.7 to 0.8 (rand < 0.8.6 carries an unsoundness
# advisory, and no 0.7.x fix exists). The crate only uses rand::Rng to fill
# bytes in SecretKey::random, which rand 0.8 keeps. solana-program pins
# libsecp256k1 =0.6.0 for host builds, so the Solana programs beside this
# folder pick it up through [patch.crates-io]. Source is otherwise upstream's.

[package]
edition = "2018"
name = "libsecp256k1"
version = "0.6.0"
authors = ["Wei Tang <hi@that.world>"]
description = "Pure Rust secp256k1 implementation."
keywords = ["crypto", "ECDSA", "secp256k1", "no_std"]
license = "Apache-2.0"
repository = "https://github.com/paritytech/libsecp256k1"
[dependencies.arrayref]
version = "0.3"

[dependencies.base64]
version = "0.12"
default-features = false

[dependencies.digest]
version = "0.9"

[dependencies.hmac-drbg]
version = "0.3"
optional = true

[dependencies.lazy_static]
version = "1.4.0"
optional = true

[dependencies.libsecp256k1-core]
version = "0.2.2"
default-features = false

[dependencies.rand]
version = "0.8"
default-features = false

[dependencies.serde]
version = "1.0.104"
features = ["derive"]
default-features = false

[dependencies.sha2]
version = "0.9"
optional = true
default-features = false

[dependencies.typenum]
version = "1.12"
optional = true
[dev-dependencies.clear_on_drop]
version = "0.2"

[dev-dependencies.hex-literal]
version = "0.2.1"

[dev-dependencies.secp256k1-test]
version = "0.17"
features = ["rand-std", "recovery"]
package = "secp256k1"

[dev-dependencies.serde_json]
version = "1.0"
[build-dependencies.libsecp256k1-gen-ecmult]
version = "0.2.1"

[build-dependencies.libsecp256k1-gen-genmult]
version = "0.2.1"

[features]
default = ["std", "hmac", "static-context"]
hmac = ["hmac-drbg", "sha2", "typenum"]
lazy-static-context = ["lazy_static", "std"]
static-context = []
std = ["libsecp256k1-core/std", "sha2/std", "rand/std", "serde/std", "base64/std"]

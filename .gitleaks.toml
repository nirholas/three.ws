# Config for `npm run audit:secrets-history` (scripts/audit-secrets-history.mjs).
# Extends gitleaks' default ruleset and allowlists only values that are public by
# design. A real credential is never added here: rotate it at the provider.
title = "three.ws full-history secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic and public values that look like credentials"
regexes = [
  # Hardhat / Anvil well-known development account keys (published in their docs).
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6''',
  # Obviously synthetic Stripe-shaped fixtures in tests.
  '''sk_live_(abc|guard|hermes|revoke|second|THREE|yourk)[A-Za-z0-9_]*''',
]
stopwords = [
  "YOUR_TOKEN", "YOUR_API_KEY", "your-api-key", "xxxxxxxx", "example", "placeholder", "changeme",
]

# Allowlists below were each reviewed on 2026-11-10 against the first full-history run
# (docs/ops/secrets-history-audit.md). Every entry is scoped to a rule AND a path. No rule is disabled.
# Unresolved on purpose (the scan must keep failing on it): the EVM key that scripts/x402-test.mjs and
# scripts/x402-all.mjs once hardcoded. See the audit doc.

[[allowlists]]
description = "Public-data entropy hits (Solana mints, EVM contract addresses, hashes, storage keys, locale strings, vendored libraries) in reviewed directories. No 64-hex private-key shape in these paths other than the zero-balance test keys covered below."
targetRules = ["generic-api-key"]
paths = [
  '''^tests/''',
  '''^public/''',
  '''^contracts/lib/''',
  '''^docs/''',
  '''^prompts/''',
  '''^robinhood/''',
  '''^.agents/''',
  '''^blog/''',
  '''^marketing/''',
  '''^specs/''',
  '''^docs-tasks/''',
  '''^third_party/''',
  '''^xactions/''',
  '''^xspace-agent/''',
  '''^dist-lib/''',
  '''^agent-voice-chat/''',
  '''^data/''',
  '''^scripts/shots/''',
]


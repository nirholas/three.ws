]

[[allowlists]]
description = "Private-key hits: the PERSONA_JWKS_PRIVATE_KEY_PEM docs example, and character-studio/key.pem, the key of a self-signed local.webaverse.com dev certificate that expired 2023-01-08."
targetRules = ["private-key"]
paths = [
  '''^character-studio/key\.pem$''',
  '''^docs/ALL\.md$''',
  '''^docs/EVERYTHING\.md$''',
  '''^docs/persona-hub\.md$''',
]

[[allowlists]]
description = "Firebase web apiKey values inside the removed rider/ game bundle. Firebase web keys are public client identifiers by design; project aerial-vehicle-466722-p5 has no API keys at all."
targetRules = ["gcp-api-key", "generic-api-key"]
paths = [
  '''^rider/build/build\.js$''',
  '''^rider/src/scene\.html$''',
]

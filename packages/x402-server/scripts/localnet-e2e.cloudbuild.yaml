# Runs scripts/localnet-e2e.mjs on a clean, uncontended Cloud Build machine:
# a throwaway solana-test-validator, one honest sponsored settle checked on
# chain, a duplicate-settle refusal, and the attack CLI. Nothing deploys and no
# real funds move (every lamport comes from the local validator's faucet).
#
#   gcloud builds submit packages/x402-server \
#     --config packages/x402-server/scripts/localnet-e2e.cloudbuild.yaml \
#     --project aerial-vehicle-466722-p5 --region us-central1
#
# Use this when the local machine cannot hold the validator's proof-of-history
# clock (it stalls at slot 0 under heavy load).
steps:
  - id: localnet-e2e
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq bzip2 >/dev/null
        sh -c "$$(curl -sSfL https://release.anza.xyz/stable/install)" >/dev/null
        export PATH="$$HOME/.local/share/solana/install/active_release/bin:$$PATH"
        solana-test-validator --version
        npm install --no-save --no-audit --no-fund @solana/web3.js@1.99.0 @solana/spl-token@0.4.15 bs58@6.0.0 @noble/curves@2.4.0 >/dev/null
        node scripts/localnet-e2e.mjs
timeout: 1200s
serviceAccount: projects/aerial-vehicle-466722-p5/serviceAccounts/three-ws-build@aerial-vehicle-466722-p5.iam.gserviceaccount.com
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Live demo: 3D AR Studio</title>

<meta property="og:description" content="The full 3D AR Studio, running the published build. Open it on a phone and tap Camera." />

<style>
:root {
	color-scheme: dark;
	--bg: #07080c;
	--panel: rgba(255, 255, 255, 0.04);
	--line: rgba(255, 255, 255, 0.1);
	--ink: #ecedf2;
	--dim: #9aa0af;
	--faint: #6b7080;
	--accent: #8b7cf8;
	--accent-ink: #dcd6ff;
	--radius: 16px;
	--font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	--mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
	margin: 0;
	font-family: var(--font);
	background: radial-gradient(120% 90% at 50% 0%, #141827 0%, #0a0b11 45%, #06070a 100%);
	color: var(--ink);
	line-height: 1.6;
	-webkit-font-smoothing: antialiased;
}
a { color: var(--accent-ink); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
header.site {
	position: sticky; top: 0; z-index: 50;
	backdrop-filter: blur(12px);
	background: rgba(7, 8, 12, 0.72);
	border-bottom: 1px solid var(--line);
}
header.site .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 750; letter-spacing: -0.01em; text-decoration: none; color: var(--ink); }
.brand .dot { width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(135deg, var(--accent), #4fd1c5); box-shadow: 0 0 18px rgba(139, 124, 248, 0.7); }
nav.site { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
nav.site a {
	color: var(--dim); text-decoration: none; font-size: 14px; font-weight: 600;
	padding: 7px 11px; border-radius: 9px; transition: color .15s, background .15s;
}
nav.site a:hover, nav.site a[aria-current="page"] { color: var(--ink); background: rgba(255, 255, 255, 0.07); }
h1, h2, h3 { line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 12px; }
h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 800; }
h2 { font-size: clamp(23px, 3.4vw, 31px); font-weight: 750; margin-top: 8px; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0 0 14px; color: var(--dim); }
p.lead { font-size: clamp(16px, 2.1vw, 19px); color: #c3c8d4; max-width: 62ch; }
section { padding: 56px 0; border-top: 1px solid var(--line); }
section:first-of-type { border-top: 0; }
.eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn {
	display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
	font-size: 15px; font-weight: 700; padding: 12px 20px; border-radius: 12px;
	background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); color: var(--ink);
	transition: background .15s, border-color .15s, transform .06s;
	cursor: pointer;
}
.btn:hover { background: rgba(255, 255, 255, 0.11); border-color: rgba(255, 255, 255, 0.24); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0d0b1e; }
.btn.primary:hover { filter: brightness(1.08); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); }
.card {
	background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
	padding: 18px 18px 16px;
}
.card h3 { margin-bottom: 6px; }
.card p { font-size: 14px; margin: 0; }
.card .ico { font-size: 22px; line-height: 1; margin-bottom: 10px; display: block; }
pre {
	margin: 0 0 14px; padding: 16px 18px; overflow-x: auto;
	background: #0b0d13; border: 1px solid var(--line); border-radius: 13px;
	font-family: var(--mono); font-size: 13.5px; line-height: 1.65; color: #d7dbe6;
}
code { font-family: var(--mono); font-size: 0.92em; }
p code, li code, td code { background: rgba(255, 255, 255, 0.07); padding: 1.5px 6px; border-radius: 6px; color: var(--accent-ink); }
table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 16px; display: block; overflow-x: auto; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink); font-weight: 700; white-space: nowrap; }
td { color: var(--dim); }
ul { color: var(--dim); padding-left: 22px; }
li { margin-bottom: 7px; }
.stage {
	position: relative; height: min(72vh, 620px); min-height: 420px;
	border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
	background: #06070a; box-shadow: 0 30px 80px -40px rgba(139, 124, 248, 0.5);
}
.pill {
	display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 650;
	color: var(--accent-ink); background: rgba(139, 124, 248, 0.14);
	border: 1px solid rgba(139, 124, 248, 0.38); border-radius: 999px; padding: 6px 13px;
	margin-bottom: 18px;
}
footer.site { border-top: 1px solid var(--line); padding: 34px 0 60px; color: var(--faint); font-size: 13.5px; }
footer.site a { color: var(--dim); }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
	appearance: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 650;
	color: var(--dim); background: rgba(255, 255, 255, 0.05); border: 1px solid transparent;
	border-radius: 999px; padding: 7px 14px;
}
.tab[aria-selected="true"] { color: var(--accent-ink); background: rgba(139, 124, 248, 0.16); border-color: rgba(139, 124, 248, 0.4); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
<script type="module" src="./ar-studio.min.js"></script>
</head>
<body>


<div style="position:fixed;inset:0"><ar-studio id="studio" style="position:absolute;inset:0;min-height:0"
	title="AR Studio" back-href="./index.html"></ar-studio></div>


</body>
</html>

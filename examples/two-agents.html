<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>&lt;agent-stage&gt;: two agents, one stage</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0f0f0f;
				--panel: #161616;
				--line: #2a2a2a;
				--text: #e9e9e9;
				--muted: #a3a3a3;
				--accent: #3b82f6;
				--accent-hover: #2563eb;
				--accent-active: #1d4ed8;
				--live: #22c55e;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
				background: var(--bg);
				color: var(--text);
				padding: 24px;
			}
			h1 {
				margin: 0 0 8px;
				font-weight: 500;
				font-size: clamp(20px, 4vw, 28px);
			}
			p {
				color: var(--muted);
				margin: 4px 0 16px;
				max-width: 70ch;
			}
			agent-stage {
				display: block;
				width: 100%;
				height: min(540px, 70vh);
				background: #1a1a1a;
				border-radius: 8px;
				overflow: hidden;
			}
			.floor {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 8px 16px;
				margin-top: 12px;
				padding: 10px 14px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--panel);
				font-size: 14px;
			}
			.floor .label {
				color: var(--muted);
			}
			.speaker {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				font-weight: 600;
			}
			.speaker::before {
				content: '';
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--line);
			}
			.speaker[data-live='true']::before {
				background: var(--live);
				box-shadow: 0 0 0 4px rgb(34 197 94 / 0.2);
			}
			.speaker[data-live='false'] {
				font-weight: 400;
				color: var(--muted);
			}
			.waiting {
				color: var(--muted);
			}
			.row {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin-top: 16px;
			}
			.row input {
				flex: 1 1 240px;
				min-width: 0;
				padding: 10px 14px;
				border-radius: 999px;
				border: 1px solid #333;
				background: #111;
				color: #eee;
				font: 14px system-ui;
			}
			.row input:hover {
				border-color: #4a4a4a;
			}
			.row input:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			.row button {
				padding: 10px 18px;
				border-radius: 999px;
				border: 0;
				background: var(--accent);
				color: white;
				font: 14px system-ui;
				cursor: pointer;
				transition: background-color 120ms ease;
			}
			.row button.secondary {
				background: #262626;
				color: var(--text);
			}
			.row button:hover {
				background: var(--accent-hover);
			}
			.row button.secondary:hover {
				background: #333;
			}
			.row button:active {
				background: var(--accent-active);
			}
			.row button.secondary:active {
				background: #3d3d3d;
			}
			.row button:focus-visible {
				outline: 2px solid #93c5fd;
				outline-offset: 2px;
			}
			.log {
				font:
					12px/1.5 ui-monospace,
					Menlo,
					monospace;
				color: #8fd4a4;
				background: #111;
				border-radius: 6px;
				padding: 12px;
				margin-top: 16px;
				max-height: 220px;
				overflow-y: auto;
			}
			.log:empty::before {
				content: 'Stage events appear here: who joined, every cue, and each change of speaker with its time.';
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<h1>&lt;agent-stage&gt; demo: two agents, one stage</h1>
		<p>
			Each agent keeps its own brain, memory and voice. The stage gives one of them the floor at a
			time: press Broadcast and both answer the cue, one after the other, never over each other.
		</p>

		<agent-stage id="stage" formation="row">
			<agent-3d
				id="leo"
				name="Coach Leo"
				body="/avatars/cz.glb"
				brain="free"
				voice
				instructions="You are Coach Leo. Friendly, short answers. When asked to talk to Mira, use say_to_agent to speak to her, then tell the user what she said."
				eager
			></agent-3d>
			<agent-3d
				id="mira"
				name="Mira"
				body="/avatars/cz.glb"
				brain="free"
				voice
				instructions="You are Mira, a quiet observer who only speaks when spoken to. Answer in one short sentence."
				eager
			></agent-3d>
		</agent-stage>

		<div class="floor" aria-live="polite">
			<span class="label">On the floor:</span>
			<span class="speaker" id="speaker" data-live="false">Nobody is speaking</span>
			<span class="waiting" id="waiting"></span>
		</div>

		<div class="row">
			<input
				id="prompt"
				aria-label="Message for Leo, or the cue to broadcast"
				placeholder="Ask Leo to say hi to Mira..."
				value="Say hi to Mira and ask her how she's doing."
			/>
			<button id="send" type="button">Send to Leo</button>
			<button id="broadcast" type="button" class="secondary">Broadcast</button>
		</div>
		<div class="log" id="log" role="log" aria-label="Stage event log"></div>

		<script type="module">
			import '../src/lib.js';

			const log = document.getElementById('log');
			const stage = document.getElementById('stage');
			const leo = document.getElementById('leo');
			const mira = document.getElementById('mira');
			const speakerEl = document.getElementById('speaker');
			const waitingEl = document.getElementById('waiting');
			const promptEl = document.getElementById('prompt');
			const t0 = performance.now();
			const stamp = () => `${String(Math.round(performance.now() - t0)).padStart(6)}ms`;

			const line = (text) => {
				const d = document.createElement('div');
				d.textContent = `${stamp()} ${text}`;
				log.appendChild(d);
				log.scrollTop = log.scrollHeight;
			};

			const nameOf = (agentId) =>
				stage.getAgents().find((a) => a.agentId === agentId)?.name || agentId;

			const renderFloor = () => {
				const now = stage.speaking;
				speakerEl.dataset.live = String(!!now);
				speakerEl.textContent = now ? `${nameOf(now.agentId)}: "${now.text}"` : 'Nobody is speaking';
				const queue = stage.speechQueue;
				waitingEl.textContent = queue.length
					? `Waiting: ${queue.map((l) => nameOf(l.agentId)).join(', ')}`
					: '';
			};

			stage.addEventListener('stage:agent-joined', (e) => line(`joined: ${e.detail.agentId}`));
			stage.addEventListener('stage:agent-left', (e) => line(`left: ${e.detail.agentId}`));
			stage.addEventListener('stage:message', (e) => {
				// Each child also gets its own copy; log the stage-level one only.
				if (e.target !== stage) return;
				line(`stage msg from ${e.detail.from}: ${JSON.stringify(e.detail.event)}`);
			});
			stage.addEventListener('stage:speaking-change', (e) => {
				const { speaking, previous } = e.detail;
				if (previous) line(`floor: ${previous.agentId} finished`);
				if (speaking) line(`floor: ${speaking.agentId} speaking (${speaking.priority})`);
				renderFloor();
			});

			// A broadcast cue: every agent answers in its own voice. Both answers are
			// requested at the same instant; the stage plays them one after another.
			for (const el of [leo, mira]) {
				el.addEventListener('stage:message', async (e) => {
					const { event } = e.detail;
					if (event?.kind !== 'cue' || !el.stageAgentId) return;
					const name = el.getAttribute('name');
					const result = await stage.speak(
						el.stageAgentId,
						`${name} here. I heard the cue: ${event.text}`,
						{ priority: 'broadcast' },
					);
					if (result.status !== 'spoken') {
						line(`${el.id}: line ${result.status} (${result.error || result.reason || 'no reason given'})`);
					}
				});
				el.addEventListener('brain:message', (e) =>
					line(`[${el.id}/${e.detail.role}] ${e.detail.content || ''}`),
				);
				el.addEventListener('skill:tool-called', (e) =>
					line(`[${el.id}] tool ${e.detail.tool}(${JSON.stringify(e.detail.args)}) -> ${JSON.stringify(e.detail.result)}`),
				);
				el.addEventListener('agent:error', (e) =>
					line(`[${el.id}] error: ${e.detail?.error?.message || 'the turn failed'}. Try again in a moment.`),
				);
			}

			document.getElementById('send').addEventListener('click', () => {
				const text = promptEl.value.trim();
				if (text) leo.say(text, { voice: true });
				else promptEl.focus();
			});

			document.getElementById('broadcast').addEventListener('click', () => {
				const text = promptEl.value.trim() || 'hello stage';
				stage.broadcast('director', { kind: 'cue', text });
			});

			renderFloor();
			window.stage = stage;
		</script>
	</body>
</html>

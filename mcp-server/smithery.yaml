# Smithery deployment config for @three-ws/mcp-server
# https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      threeWsApiKey:
        type: string
        description: "A three.ws API key (a free account is enough, create one at https://three.ws/dashboard/api-keys). Making or rigging a 3D model needs it."
    required: []
  commandFunction: |
    (config) => ({ command: "npx", args: ["-y", "@three-ws/mcp-server"], env: config.threeWsApiKey ? { THREE_WS_API_KEY: config.threeWsApiKey } : {} })

name: X announcements

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next approved item without posting
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '7 14 * * *'
    - cron: '13 19 * * *'
    - cron: '19 0 * * *'

concurrency:
  group: x-announcements-trythreews
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run x:announce:check

  publish:
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
      (github.event_name == 'schedule' && vars.X_ANNOUNCEMENT_AUTO_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run && vars.X_ANNOUNCEMENT_AUTO_PUBLISH == 'true')
    runs-on: ubuntu-latest
    environment: x-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Preview next approved announcement
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm run x:announce:run -- --dry-run
      - name: Publish one due announcement
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm run x:announce:run
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          X_ANNOUNCEMENT_STATE_BUCKET: ${{ secrets.X_ANNOUNCEMENT_STATE_BUCKET }}
          X_ANNOUNCEMENT_STATE_KEY: state/x-announcements.json

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "07:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      pump-fun:
        patterns:
          - "@pump-fun/*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - pump.fun
    ignore:
      # The multiplayer server must speak the wire protocol of the colyseus.js
      # client the web app ships (0.16, schema 3 decoding). A 0.18 server built
      # an image that dropped every player on join, and the bump skipped
      # multiplayer/package-lock.json, so the image stopped building at all
      # (2026-10-30). Move server and client together, by hand, never here.
      # tests/multiplayer-colyseus-pin.test.js holds the pair in step.
      - dependency-name: "@colyseus/core"
        versions:
          - ">=0.17.0"
      - dependency-name: "@colyseus/monitor"
        versions:
          - ">=0.17.0"
      - dependency-name: "@colyseus/ws-transport"
        versions:
          - ">=0.17.0"
      - dependency-name: "@colyseus/redis-driver"
        versions:
          - ">=0.17.0"
      - dependency-name: "@colyseus/redis-presence"
        versions:
          - ">=0.17.0"
      - dependency-name: "@colyseus/schema"
        versions:
          - ">=4.0.0"
      # @vercel/og 1.x (through 1.0.3, the latest as of 2026-10-30) bundles an
      # Emscripten harfbuzz build that calls require("fs") and reads __dirname
      # at import time, so its Node entry cannot load in an ESM server at all.
      # The 1.0.3 bump took every /api/*-og image to a 500 in production.
      # tests/page-og-carbon.test.js renders through the real package and fails
      # on a broken release; re-test there before lifting this.
      - dependency-name: "@vercel/og"
        versions:
          - ">=1.0.0"
      # @upstash/ratelimit >= 2.1.0 prefixes its Lua scripts with
      # `#!lua flags=allow-key-locking`, an Upstash-hosted-only flag. Production
      # Redis sits behind a self-hosted SRH proxy that rejects it, which opens
      # the limiter circuit and pushes every bucket onto the Postgres fallback.
      # The 2026-10-29 bump to 2.2.0 reintroduced exactly that.
      # tests/ratelimit-lua-shebang.test.js fails on any release carrying it.
      - dependency-name: "@upstash/ratelimit"
        versions:
          - ">=2.1.0"
      # The Teams meeting stage runs on @microsoft/live-share 1.x, which peers on
      # the Fluid 1.x client (fluid-framework ^1.2.3, azure-client ^1.0.0). Fluid
      # 2+ drops packages Live Share loads, and legacy-peer-deps lets the bump
      # install anyway: the 1.4.0 -> 3.11.0 PR (#617, 2026-11-12) left Live Share
      # unable to load. Move the Fluid client only together with a Live Share
      # major that peers on it. tests/teams-stage-fluid-pin.test.js holds the pair.
      - dependency-name: "fluid-framework"
        versions:
          - ">=2.0.0"
      - dependency-name: "@fluidframework/azure-client"
        versions:
          - ">=2.0.0"
      - dependency-name: "@fluidframework/test-client-utils"
        versions:
          - ">=2.0.0"

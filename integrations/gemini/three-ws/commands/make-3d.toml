description = "Make a textured 3D model (GLB) from a sentence with three.ws, check it with a render, and print the GLB, viewer link and embed code"
prompt = '''
# Make a 3D model

Make one 3D model from this description: {{args}}

If the description is empty, ask the user what to model in one short line and stop.

1. **Try the free catalog first.** Call the three-ws `search_catalog` tool with `q` set
   to the two or three key nouns of the description and `limit` 3. If a result clearly
   matches what the user asked for (the same object, not just the same category), show
   it with its viewer link and ask whether to use it or generate a new one. Otherwise go
   straight to step 2 without asking.
2. **Generate.** Call `forge_free` with `prompt` set to the description (one object, its
   material and style; drop filler words) and `idempotency_key` set to a short unique
   string you choose now. Reuse the same key if you retry this call, so a retry never
   starts a second generation.
3. **Wait for it.** If the result says `status: "pending"`, call `get_job` with its
   `job_id`. Between calls, wait the `eta_seconds` it reports (15 seconds when it reports
   none). Tell the user the phase once, not on every poll. A draft usually takes one to
   three minutes. Stop after 10 minutes and give the user the job id so they can collect
   it later with `get_job`.
4. **Look at it.** Call `look_at_model` on the finished `glb_url` with `views`
   `["three-quarter", "back"]`. In one sentence, say what the render shows and whether
   it matches the request. If it is clearly wrong (a missing part, fused shapes, the
   wrong subject), say what is wrong and offer one `refine_model` pass; do not refine
   without the user's yes.
5. **Print the result** as a short block the user can copy:

   ```
   GLB:      <glb_url>
   Viewer:   <viewer_url>
   Receipt:  <receipt.url>
   ```

   Then print the `embed_html` the job returned in an `html` code block, unchanged.

## When something goes wrong

- The three-ws tools are missing, or a call answers `sign_in_required`: making a model
  needs a free three.ws account. Tell the user to run `/mcp auth three-ws` (it opens the
  three.ws sign-in, which can create an account), then run the command again.
- `failed` from `get_job`: show the reason it gives and its suggested next step. Retry
  once with a new `idempotency_key` only if the reason says the failure was temporary.
- A rate-limit or quota answer: show the message as given, including when it resets. Do
  not loop.
'''

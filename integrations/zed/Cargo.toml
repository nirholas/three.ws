[package]
name = "zed_three_ws"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Zed extension that runs the @three-ws/mcp-server context server."

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
schemars = "0.8"
zed_extension_api = "0.7.0"

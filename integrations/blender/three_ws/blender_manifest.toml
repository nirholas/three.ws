schema_version = "1.0.0"

id = "three_ws"
version = "1.1.0"
name = "Forge by three.ws"
tagline = "3D from text or images, and 360 footage to splats"
maintainer = "three.ws"
type = "add-on"

website = "https://github.com/nirholas/three.ws/tree/main/integrations/blender"

tags = ["Import-Export", "Add Mesh"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 three.ws",
]

[permissions]
network = "Send prompts and 360 footage to three.ws, get results back"
files = "Read your images and 360 files, save and import results"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
]
